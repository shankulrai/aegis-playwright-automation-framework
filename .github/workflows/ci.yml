name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce core module protection
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          if echo "$CHANGED_FILES" | grep -q '^core/'; then
            echo "::error::Changes under core/** are restricted. Create or update a team module instead."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build
        run: ./gradlew clean build
      - name: Run tests
        run: ./gradlew test
      - name: Generate report archive
        if: always()
        run: |
          mkdir -p report-archive
          cp -R build/reports report-archive/ || true
          cp -R */build/reports report-archive/ || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: report-archive
